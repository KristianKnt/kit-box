<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | kit-box</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../components/header/header.css">
    <link rel="stylesheet" href="../components/footer/footer.css">
    <link rel="stylesheet" href="./paginaRegistro.css">
    <link rel="stylesheet" href="./formularioRegistro.css">
    <link rel="icon" type="image/svg+xml" href="../assets/imagenes/nosotros/Logo.svg">
</head>

<body>

    <!-- HEADER -->

    <div id="header"></div> <!-- Se carga con JS-->

    <!-- PAGINA DE REGISTRO -->

    <!-- data-papel-relleno: papelitos cayendo detrás de la tarjeta (los pone components.js) -->
    <main class="registro-pagina" data-papel-relleno="20">
        <section class="registro-tarjeta row g-0">

            <!-- PANEL IZQUIERDO: BIENVENIDA -->
            <div class="registro-bienvenida col-12 col-lg-5">
                <a class="registro-etiqueta" href="../index.html">Bienvenido a kit-box</a>
                <h1 class="registro-titulo">Todo lo que necesitas para empezar, en una sola caja.</h1>
                <p class="registro-texto">Crea tu cuenta para estar más cerca de tu próxima experiencia.</p>
            </div>

            <!-- PANEL DERECHO: FORMULARIO -->
            <div class="registro-contenido col-12 col-lg-7">
                <h2 class="registro-encabezado">Crea tu cuenta</h2>
                <p class="registro-subtitulo">Completa tus datos para registrarte.</p>

                <form id="formulario-crear-cuenta" method="post">
                    <div class="registro-campos">
                        <div class="registro-campo">
                            <label for="registro-nombre">Nombre</label>
                            <input id="registro-nombre" name="nombre" type="text" autocomplete="given-name"
                                required maxlength="60" placeholder="Tu nombre">
                        </div>

                        <div class="registro-campo">
                            <label for="registro-apellido">Apellido</label>
                            <input id="registro-apellido" name="apellido" type="text" autocomplete="family-name"
                                required maxlength="60" placeholder="Tu apellido">
                        </div>

                        <div class="registro-campo registro-campo-completo">
                            <label for="registro-correo">Correo electrónico</label>
                            <input id="registro-correo" name="correo" type="email" autocomplete="email" required
                                maxlength="254" placeholder="tu@correo.com">
                        </div>

                        <div class="registro-campo registro-campo-completo">
                            <label for="registro-telefono">Teléfono <span>(opcional)</span></label>
                            <input id="registro-telefono" name="telefono" type="tel" autocomplete="tel"
                                inputmode="tel" pattern="[+]?[0-9 \(\)\-]{7,20}"
                                title="Ingresa un teléfono válido." placeholder="+57 300 123 4567">
                        </div>

                        <div class="registro-campo registro-campo-completo">
                            <label for="registro-contrasena">Contraseña</label>
                            <input id="registro-contrasena" name="contrasena" type="password"
                                autocomplete="new-password" required minlength="8" maxlength="128"
                                aria-describedby="ayuda-contrasena" placeholder="Mínimo 8 caracteres">
                            <small id="ayuda-contrasena">Usa al menos 8 caracteres.</small>
                        </div>

                        <div class="registro-campo registro-campo-completo">
                            <label for="registro-confirmar-contrasena">Confirmar contraseña</label>
                            <input id="registro-confirmar-contrasena" name="confirmar-contrasena"
                                type="password" autocomplete="new-password" required minlength="8"
                                maxlength="128" aria-describedby="error-contrasenas"
                                placeholder="Escribe de nuevo tu contraseña">
                            <small id="error-contrasenas" class="registro-error" aria-live="polite"></small>
                        </div>
                    </div>

                    <!-- BOTON REGISTRO -->

                    <button class="registro-boton" type="submit">Crear cuenta</button>

                    <p class="registro-cuenta">¿Ya tienes cuenta? <a href="../tienda/login/login.html">Inicia sesión</a></p>

                    <p id="mensaje-registro" class="registro-mensaje" role="status" aria-live="polite"></p>
                </form>
            </div>

        </section>
    </main>

    <!-- FOOTER--> <!-- Se carga con JS -->

    <div id="footer"></div>

    <!-- COMPONENTES --> <!-- Se carga con JS -->

    <script src="../js/sesion.js"></script> <!-- sesión del usuario: va antes de components.js -->
    <script src="../js/components.js"></script>
    <script src="../tienda/carrito/localStorage.js"></script>
    <script src="../tienda/carrito/agr-carrito.js"></script>
    <script src="../registro/ResgistoLocalStorage.js"></script>
    <script src="../registro/RegistroValidaciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
