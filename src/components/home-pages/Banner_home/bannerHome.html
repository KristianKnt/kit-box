<!-- Banner Home: este archivo es solo un pedazo de HTML (sin <html>, <head> ni <body>)
     porque components.js lo inserta dentro de <div id="banner_home_page"> del index.
     El carrusel lo arranca bannerHome.js después de insertarlo. -->

<section class="container-fluid p-0 banner_home_page">

    <!-- id distinto al del contenedor del index: antes los dos se llamaban "banner_home_page"
         y las flechas y los puntitos apuntaban al contenedor vacío en vez de al carrusel -->
    <div id="carrusel-banner-home" class="carousel slide carousel-fade" data-bs-ride="carousel">

        <!-- Capa de texto estática que flota sobre el carrusel -->
        <div class="banner-overlay-text banner-contacto-informacion">
            <span class="banner-contacto-etiqueta">Encuentra tu pasión</span>
            <h1 class="banner-contacto-titulo">El kit perfecto <br>para cada momento</h1>
            <p class="banner-contacto-texto">Arte, tecnología, mascotas y más.<br>
                Encuentra en Kit-Box el detalle perfecto <br> para crear, regalar o disfrutar.<br>
                <strong>¡Escríbenos y pide el tuyo!</strong>
            </p>
        </div>

        <!-- slides -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="3"
                aria-label="Slide 4"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="4"
                aria-label="Slide 5"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="5"
                aria-label="Slide 6"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="6"
                aria-label="Slide 7"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="7"
                aria-label="Slide 8"></button>
            <button type="button" data-bs-target="#carrusel-banner-home" data-bs-slide-to="8"
                aria-label="Slide 9"></button>
        </div>

        <!-- Imágenes -->
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/01_kit_herramientas.jpg" class="d-block w-100"
                    alt="Herramientas">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/02_kit_arte.jpg" class="d-block w-100" alt="Arte">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/03_kit_mascotas.jpg" class="d-block w-100"
                    alt="Mascotas">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/04_kit_regalos_bienestar.jpg"
                    class="d-block w-100" alt="Regalos">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/05_kit_cocina.jpg" class="d-block w-100"
                    alt="Cocina">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/06_kit_deportivo.jpg" class="d-block w-100"
                    alt="Deportivo">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/07_kit_papeleria.jpg" class="d-block w-100"
                    alt="Papeleria">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/08_kit_tecnologia.jpg" class="d-block w-100"
                    alt="Tecnologia">
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="../../../assets/imagenes/Home_pages/09_kit_jardineria.jpg" class="d-block w-100"
                    alt="Jardineria">
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carrusel-banner-home"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carrusel-banner-home"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>
</section>
