<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/">
</head>

<body>
    <main>
        <!--Banner-->
        <section class="container-fluid  p-5 text-center">
            <div id="bannerPrincipal" class="carousel slide" data-bs-ride="carousel" id="Banner">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#bannerPrincipal" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#bannerPrincipal" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                </div>
                <div class="carousel-inner">

                    <!-- Banner 1: Mujeres-->
                    <div class="carousel-item active" data-bs-interval="5000">
                        <img src="../assets/images/banner/img2.jpg" class="d-block w-100" alt="Colección para Mujeres"
                            style="height: 60vh; object-fit: cover;">
                        <!-- Botón centrado -->
                        <div class="position-absolute top-50 start-50 translate-middle text-center">
                            <a href="#catalogo-section" class="btn btn-light btn-lg shadow">Ver Colección Mujer</a>
                        </div>
                    </div>

                    <!-- Banner 2: Hombres -->
                    <div class="carousel-item" data-bs-interval="5000">
                        <img src="../assets/images/banner/img1.jpg" class="d-block w-100" alt="Colección para Hombres"
                            style="height: 60vh; object-fit: cover;">
                        <!-- Botón centrado -->
                        <div class="position-absolute top-50 start-50 translate-middle text-center">
                            <a href="#catalogo-section" class="btn btn-dark btn-lg shadow">Ver Colección Hombre</a>
                        </div>
                    </div>
                </div>

                <!-- Flecha Anterior -->
                <button class="carousel-control-prev" type="button" data-bs-target="#bannerPrincipal"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>

                <!-- Flecha Siguiente -->
                <button class="carousel-control-next" type="button" data-bs-target="#bannerPrincipal"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
    </main>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
