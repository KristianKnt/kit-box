<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página De Contacto | kit-box</title>
    <link rel="stylesheet" href="contacto.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/footer/footer.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/imagenes/nosotros/Logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="body">
    <!-- HEADER -->
    <div id="header"></div> <!--se carga con js-->

    <div class="container-fluid">

        <!--BANNER-->
        <section class="banner-sobre-nosotros"> <!--inicio seccion banner-->
            <div class="banner-sobre-nosotros-fondo"> <!--banner cargado en css como fondo de container-->
                <div class="banner-nosotros-informacion"> <!--contenedor de texto banner-->
                    <h1 class="banner-nosotros-titulo">Todo lo que necesitas para empezar, en una sola caja.
                    </h1>
                    <!--<p class="banner-nosotros-texto">Reunimos en un solo lugar lo necesario para comenzar una nueva actividad, un hobby o un proyecto, de forma sencilla y práctica.
</p>--->
                    <div class="nosotros-botones">
                        <a href="#nuestro-equipo-seccion" class="nosotros-bt-conocenos">Conócenos ↓</a>
                        <a href="#catalogo" class="nosotros-bt-explorar"> Explorar kits</a>
                    </div>
                </div>
            </div>
        </section>

        <!--seccion formulario y localizacion-->
        <section calss="seccion_formulario_localizacion">
            <!--El contenedor padre debe tener class="row" -->
            <div class="row p-5">

                <!-- Columna izquierda (Formulario): ocupa 8 espacios -->
                <div class="col-8">
                    <div class="p-2 p-md-5 border rounded shadow-sm fondo-formulario-contenedor">
                        <h3 class="text-center mb-4">Contáctanos</h3>

                        <!-- Separamos el id de las clases y centramos la caja del formulario -->
                        <form id="formulario-contacto" class="formulario-centrado mx-auto" style="max-width: 1000px;">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="dato-nombre" class="form-label">Nombre</label>
                                <input class="form-control campo-input" type="text" id="dato-nombre"
                                    placeholder="Nombre">
                                <p id="error-dato-nombre" class="text-danger small"></p>
                            </div>

                            <!-- Apellido -->
                            <div class="mb-3">
                                <label for="dato-apellido" class="form-label">Apellido</label>
                                <input class="form-control campo-input" type="text" id="dato-apellido"
                                    placeholder="Apellido">
                                <p id="error-dato-apellido" class="text-danger small"></p>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="dato-email" class="form-label">Email</label>
                                <input class="form-control campo-input" type="email" id="dato-email"
                                    placeholder="ejemplo@gmail.com">
                                <p id="error-dato-email" class="text-danger small"></p>
                            </div>

                            <!-- Teléfono -->
                            <div class="mb-3">
                                <label for="dato-telefono" class="form-label">Teléfono</label>
                                <input class="form-control campo-input" type="tel" id="dato-telefono"
                                    placeholder="Solo números">
                                <p id="error-dato-telefono" class="text-danger small"></p>
                            </div>

                            <!-- Descripción (Cambiado a textarea para mejor formato de mensaje) -->
                            <div class="mb-3">
                                <label for="dato-mensaje" class="form-label">Descripción</label>
                                <textarea class="form-control campo-input" id="dato-mensaje" rows="3"
                                    placeholder="Escribe aquí tu consulta..."></textarea>
                                <p id="error-dato-mensaje" class="text-danger small"></p>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary"
                                    id="boton-enviar-formulario-contacto">Enviar</button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Columna derecha (Información): ocupa 4 espacios -->
                <div class="col-4">
                    <div class="p-3 border bg-light">
                        <h3>Información</h3>
                        <!--prueba-->

                        <!--fin prueba-->
                        <p>Contenido más angosto aquí...</p>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <!-- COMPONENTES -->
    <script src="../../js/components.js"></script>
    <script src="contacto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
