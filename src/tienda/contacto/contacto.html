<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página De Contacto | kit-box</title>
    <link rel="stylesheet" href="contacto.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/footer/footer.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/imagenes/nosotros/Logo.svg">
</head>

<body>
    <!-- HEADER -->
    <div id="header"></div> <!--se carga con js-->

    <div class="container-fluid">

        <!--BANNER-->
        <section class="banner-contacto"> <!--inicio seccion banner-->
            <div class="banner-contacto-fondo"> <!--banner cargado en css como fondo de container-->
                <div class="banner-contacto-informacion"> <!--contenedor de texto banner-->
                    <span class="banner-contacto-etiqueta">
                        <img class="banner-contacto-icono" src="../../assets/imagenes/contacto/sobre.svg" alt="">Estamos aquí para ayudarte</span>
                    <h1 class="banner-contacto-titulo">Contáctanos
                    </h1>
                    <p class="banner-contacto-texto">¿Tienes alguna duda, sugerencia o necesitas ayuda?
                        Escríbenos, estaremos encantados de atenderte.</p>
                    
                </div>
            </div>
        </section>


    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <!-- COMPONENTES -->
    <script src="../../js/components.js"></script>
    <script src="contacto.js"></script>
</body>

</html>
