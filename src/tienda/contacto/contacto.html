<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página De Contacto | kit-box</title>
    <link rel="stylesheet" href="contacto.css">
    <link rel="stylesheet" href="../../components/header/header.css">

    <link rel="icon" type="image/svg+xml" href="../../assets/imagenes/nosotros/Logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- HEADER -->
    <div id="header"></div> <!--se carga con js-->

    <div class="container-fluid">

        <!--BANNER-->
        <section class="banner-sobre-nosotros"> <!--inicio seccion banner-->
            <div class="banner-sobre-nosotros-fondo"> <!--banner cargado en css como fondo de container-->
                <div class="banner-nosotros-informacion"> <!--contenedor de texto banner-->
                    <h1 class="banner-nosotros-titulo">Todo lo que necesitas para empezar, en una sola caja.
                    </h1>
                    <!--<p class="banner-nosotros-texto">Reunimos en un solo lugar lo necesario para comenzar una nueva actividad, un hobby o un proyecto, de forma sencilla y práctica.
</p>--->
                    <div class="nosotros-botones">
                        <a href="#nuestro-equipo-seccion" class="nosotros-bt-conocenos">Conócenos ↓</a>
                        <a href="#catalogo" class="nosotros-bt-explorar"> Explorar kits</a>
                    </div>
                </div>
            </div>
        </section>

        <!--seccion formulario y localizacion-->
        <section>
            <!-- IMPORTANTE: El contenedor padre debe tener class="row" -->
            <div class="row">

                <!-- Columna izquierda (Formulario): ocupa 8 espacios -->
                <div class="col-8">
                    <div class="p-3 border">
                        <h3>Formulario</h3>
                        <form>
                            <!-- Tu formulario aquí -->
                             <!--prueba-->
                        <div>
                            <label for="sizesInputSmall" class="form-label">Small input</label>
                            <input class="form-control form-control-sm" type="text" id="sizesInputSmall"
                                placeholder="Small input" aria-label="Small input example">
                        </div>
                        <div>
                            <label for="sizesInputDefault" class="form-label">Default input</label>
                            <input class="form-control" type="text" id="sizesInputDefault" placeholder="Default input"
                                aria-label="Default input example">
                        </div>
                        <div>
                            <label for="sizesInputLarge" class="form-label">Large input</label>
                            <input class="form-control form-control-lg" type="text" id="sizesInputLarge"
                                placeholder="Large input" aria-label="Large input example">
                        </div>
                        <!--fin prueba-->
                        </form>
                    </div>
                </div>

                <!-- Columna derecha (Información): ocupa 4 espacios -->
                <div class="col-4">
                    <div class="p-3 border bg-light">
                        <h3>Información</h3>
                        <!--prueba-->
                        
                        <!--fin prueba-->
                        <p>Contenido más angosto aquí...</p>
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <!-- COMPONENTES -->
    <script src="../../js/components.js"></script>
    <script src="contacto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
