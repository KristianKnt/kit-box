<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página De Catalogo | kit-box</title>
    <link rel="stylesheet" href="./catalogo.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/footer/footer.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/imagenes/nosotros/Logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div id="header"></div> <!--se carga con js-->
    <!--Div aletar compra-->
    <div id="alerta-contenedor" class="position-fixed top-0 end-0 p-3" style="z-index: 1080;"></div>
    <!--BANNER-->
    <section class="banner-contacto"> <!--inicio seccion banner-->
        <div class="banner-contacto-fondo"> <!--banner cargado en css como fondo de container-->
            <div class="banner-contacto-informacion"> <!--contenedor de texto banner-->
                <span class="banner-contacto-etiqueta">
                    <img class="banner-contacto-icono" src="../../assets/imagenes/contacto/sobre.svg"
                        alt="">Catalogo</span>
                <h1 class="banner-contacto-titulo">Tu primer paso empieza aquí
                </h1>
                <p class="banner-contacto-texto">Explora nuestro catálogo y encuentra todo lo que necesitas para darle
                    vida a tu próximo proyecto
                </p>

            </div>
        </div>
    </section>

    <section class="py-10">
        <div class="container-fluid">
            <div class="row align-items-start">

                <!-- Categorías (los botones se crean con filtros-catalogos.js) -->
                <div class="col-12 col-md-3 col-xl-2 mb-4 py-4">
                    <h2>Categorías</h2>
                    <div id="lista-categorias" class="catalogo-categorias" role="group"
                        aria-label="Filtrar por categoría"></div>
                </div>

                <!-- Tarjetas de productos -->
                <div class="col-12 col-md-9 col-xl-10 mb-4 py-4">

                    <!-- BUSCADOR Y FILTROS -->
                    <div class="catalogo-herramientas">

                        <!-- barra de búsqueda -->
                        <div class="catalogo-buscador">
                            <svg class="catalogo-buscador-lupa" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"></circle>
                                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                            </svg>
                            <label for="buscador-catalogo" class="visually-hidden">Buscar kits</label>
                            <input type="search" id="buscador-catalogo" class="catalogo-buscador-input"
                                placeholder="Busca tu kit: herramientas, acuarela, mascotas..." autocomplete="off">
                            <button type="button" id="borrar-busqueda" class="catalogo-buscador-borrar"
                                aria-label="Borrar búsqueda" hidden>&times;</button>
                        </div>

                        <!-- botón de filtros (menú desplegable de Bootstrap) -->
                        <div class="dropdown">
                            <button type="button" class="catalogo-boton-filtros" data-bs-toggle="dropdown"
                                data-bs-auto-close="outside" aria-expanded="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <line x1="4" y1="7" x2="20" y2="7"></line>
                                    <line x1="7" y1="12" x2="17" y2="12"></line>
                                    <line x1="10" y1="17" x2="14" y2="17"></line>
                                </svg>
                                Filtros
                                <span id="contador-filtros" class="catalogo-contador" hidden></span>
                            </button>

                            <div class="dropdown-menu dropdown-menu-end catalogo-panel-filtros">
                                <p class="catalogo-panel-titulo">Ordenar por</p>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="orden" id="orden-defecto"
                                        value="defecto" checked>
                                    <label class="form-check-label" for="orden-defecto">Recomendados</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="orden" id="orden-menor"
                                        value="precio-menor">
                                    <label class="form-check-label" for="orden-menor">Precio: menor a mayor</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="orden" id="orden-mayor"
                                        value="precio-mayor">
                                    <label class="form-check-label" for="orden-mayor">Precio: mayor a menor</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="orden" id="orden-nombre"
                                        value="nombre">
                                    <label class="form-check-label" for="orden-nombre">Nombre (A - Z)</label>
                                </div>

                                <hr class="catalogo-panel-linea">

                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch"
                                        id="solo-disponibles">
                                    <label class="form-check-label" for="solo-disponibles">Solo kits con stock</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- cuántos resultados hay (aria-live: el lector de pantalla lo anuncia) -->
                    <p id="resumen-resultados" class="catalogo-resumen" aria-live="polite"></p>

                    <div id="lista-productos" class="row g-4"></div>

                    <!-- mensaje cuando la búsqueda no encuentra nada -->
                    <div id="sin-resultados" class="catalogo-vacio" hidden>
                        <p class="catalogo-vacio-titulo">No encontramos kits con esa búsqueda</p>
                        <p class="catalogo-vacio-texto">Prueba con otra palabra o mira todas las categorías.</p>
                        <button type="button" id="limpiar-filtros" class="catalogo-vacio-boton">Limpiar filtros</button>
                    </div>
                </div>

            </div>
        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer"></div>
    <!-- COMPONENTES -->
    <script src="../../components/header/header.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../carrito/localStorage.js"></script>
    <script src="../catalogo/catalogo.js"></script>
    <script src="../catalogo/filtros-catalogos.js"></script>
    <script SRC="../carrito/agr-carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
