<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador | kit-box</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../../components/header/header.css">
  <link rel="stylesheet" href="../../components/footer/footer.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="tablaAdmStyles.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/imagenes/nosotros/Logo.svg">
</head>

<body>
  <!-- HEADER -->
  <div id="header"></div> <!--se carga con js -->

  <main class="container-fluid">
    <div class="row p-2 p-md-4 g-3 g-md-4">
      <!-- Columna izquierda: lista de productos -->
      <section class="col-12 col-lg-8">
        <div class="p-2 p-md-4 rounded shadow-sm"> <!-- antes p-4, ahora chico en celular y normal desde md -->
          <div id="lista-productos"></div> <!-- se carga con js -->
        </div>
      </section>

      <!-- Columna derecha: formulario para agregar un producto -->
      <section id="seccion_formulario_localizacion" class="col-12 col-lg-4">
        <div id="contenedor-formulario" class="p-2 p-md-4 rounded shadow-sm"> <!-- igual, antes p-4 -->
          <h2 class="h4 text-center mb-4">Agregar producto</h2>

          <form id="formulario-producto" novalidate>

            <div class="row g-3">

              <!-- 1. Nombre -->
              <div class="col-12">
                <label for="dato-nombre" class="form-label">Nombre</label>
                <input class="form-control" type="text" id="dato-nombre" name="nombre"
                  placeholder="Ej: Kit Básico para el Hogar" required>
                <p id="error-dato-nombre" class="text-danger small"></p>
              </div>

              <!-- 2. Descripción -->
              <div class="col-12">
                <label for="dato-descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="dato-descripcion" name="descripcion" rows="3" required
                  placeholder="¿Qué trae el kit?"></textarea>
                <p id="error-dato-descripcion" class="text-danger small"></p>
              </div>

              <!-- 3. Precio -->
              <div class="col-12">
                <label for="dato-precio" class="form-label">Precio</label>
                <input class="form-control" type="number" id="dato-precio" name="precio" min="0" placeholder="Ej: 45000"
                  required>
                <p id="error-dato-precio" class="text-danger small"></p>
              </div>

              <!-- 4. Imagen (nombre del archivo, como en el JSON) -->
              <div class="col-12">
                <label for="dato-imagen" class="form-label">Imagen</label>
                <input class="form-control" type="text" id="dato-imagen" name="imagen"
                  placeholder="ej: src/assets/imagenes/img_json/01_Kit_de_Herramientas/herr_03.jpg" required>
                <p id="error-dato-imagen" class="text-danger small"></p>
              </div>

              <!-- 5. Stock -->
              <div class="col-12">
                <label for="dato-stock" class="form-label">Stock</label>
                <input class="form-control" type="number" id="dato-stock" name="stock" min="0" placeholder="Ej: 10"
                  required>
                <p id="error-dato-stock" class="text-danger small"></p>
              </div>

              <!-- 6. Categoría -->
              <div class="col-12">
                <label for="dato-categoria" class="form-label">Categoría</label>
                <select class="form-select" id="dato-categoria" name="categoria" required>
                  <option value="" selected disabled>Selecciona una categoría</option>
                  <option value="Kit de Herramientas">Kit de Herramientas</option>
                  <option value="Kit de Arte">Kit de Arte</option>
                  <option value="Kit de Mascotas">Kit de Mascotas</option>
                  <option value="Kit de Bienestar">Kit de Bienestar</option>
                  <option value="Kit de Cocina">Kit de Cocina</option>
                  <option value="Kit Deportivo">Kit Deportivo</option>
                  <option value="Kit de Papelería">Kit de Papelería</option>
                  <option value="Kit de Tecnología">Kit de Tecnología</option>
                  <option value="Kit de Jardinería">Kit de Jardinería</option>
                </select>
                <p id="error-dato-categoria" class="text-danger small"></p>
              </div>

              <!-- 7. Destacado -->
              <div class="col-12">
                <label for="dato-destacado" class="form-label">Destacado</label>
                <select class="form-select" id="dato-destacado" name="destacado" required>
                  <option value="" selected disabled>Selecciona una opción</option>
                  <option value="true">Sí</option>
                  <option value="false">No</option>
                </select>
                <p id="error-dato-destacado" class="text-danger small"></p>
              </div>

              <!-- Botón -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" id="boton-agregar-producto">Agregar producto</button>
              </div>

            </div>

          </form>
        </div>
      </section>

    </div>
  </main>

  <!-- FOOTER -->
  <div id="footer"></div> <!--se carga con js-->

  <!-- SCRIPTS -->
  <script src="../../js/components.js"></script>
  <!-- Validación del formulario -->
  <script type="module" src="admin-validation.js"></script>
  <!-- Lógica de productos existente -->
  <script type="module" src="admin.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
